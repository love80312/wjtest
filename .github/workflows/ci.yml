
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']   # oldest supported version and the newest one

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python formatter tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) {
            throw "Python formatter tests failed with exit code $LASTEXITCODE"
          }

  build:
    needs: python-tests
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Locate Visual Studio 2022
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsPath = & $vswhere `
            -latest `
            -products '*' `
            -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if ($LASTEXITCODE -ne 0 -or -not $vsPath) {
            throw "Visual Studio 2022 with the x64 C++ toolset was not found."
          }

          Write-Host "Visual Studio path: $vsPath"
          Add-Content -Path $env:GITHUB_ENV -Value "VS_PATH=$vsPath"

      - name: Install ATL for v143
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $atlRoot = Join-Path $env:VS_PATH "VC\Tools\MSVC"

          if (-not (Test-Path $installer)) {
            throw "Visual Studio Installer setup.exe was not found."
          }

          $header = Get-ChildItem `
            -Path $atlRoot `
            -Filter atlbase.h `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\atlmfc\\include\\atlbase\.h$'
            } |
            Select-Object -First 1

          if ($header) {
            Write-Host "ATL is already installed: $($header.FullName)"
          }
          else {
            $argumentLine = 'modify --installPath "' +
              $env:VS_PATH +
              '" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart'

            Write-Host "Installing Microsoft.VisualStudio.Component.VC.ATL"

            $installerProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList $argumentLine `
              -WorkingDirectory $env:TEMP `
              -Wait `
              -PassThru

            Write-Host "ATL installer exit code: $($installerProcess.ExitCode)"

            if ($installerProcess.ExitCode -notin @(0, 3010)) {
              throw "ATL installation failed with exit code $($installerProcess.ExitCode)"
            }

            $header = Get-ChildItem `
              -Path $atlRoot `
              -Filter atlbase.h `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '\\atlmfc\\include\\atlbase\.h$'
              } |
              Select-Object -First 1

            if (-not $header) {
              throw "ATL installation finished, but atlbase.h was not found."
            }

            Write-Host "ATL header found: $($header.FullName)"
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Build x64 COM DLL
        shell: pwsh
        run: |
          msbuild src/RPGJsonBeautifier.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Assemble WinMerge plugin
        shell: pwsh
        run: |
          $buildDir = "src/Build/x64/Release/MergePlugins"
          $packageDir = "dist/MergePlugins"
          $dll = Join-Path $buildDir "RPGJsonBeautifier.dll"
          $tlb = Join-Path $buildDir "DisplayJSONFiles.tlb"
          $pythonScript = "src/RPGJsonBeautifier.py"
          $settingsFile = "src/RPGJsonBeautifier.ini"

          if (-not (Test-Path $dll)) {
            throw "Built DLL was not found: $dll"
          }

          if (-not (Test-Path $pythonScript)) {
            throw "Python formatter was not found: $pythonScript"
          }

          if (-not (Test-Path $settingsFile)) {
            throw "Formatter settings file was not found: $settingsFile"
          }

          New-Item -ItemType Directory -Path $packageDir -Force |
            Out-Null

          Copy-Item -LiteralPath $dll -Destination $packageDir -Force
          Copy-Item -LiteralPath $pythonScript -Destination $packageDir -Force
          Copy-Item -LiteralPath $settingsFile -Destination $packageDir -Force

          if (Test-Path $tlb) {
            Copy-Item -LiteralPath $tlb -Destination $packageDir -Force
          }

          Write-Host "Packaged plugin files:"
          Get-ChildItem -Path $packageDir |
            Select-Object Name, Length

      - name: Smoke-test packaged formatter
        shell: python
        run: |
          # Runs the packaged script (next to its .ini) and compares with the HTML-tool golden output.
          import os, subprocess, sys
          out = os.path.join(os.environ["RUNNER_TEMP"], "map.formatted.json")
          subprocess.run([sys.executable, "dist/MergePlugins/RPGJsonBeautifier.py", "tests/golden/map.in.json", out], check=True)
          def read(path):
              with open(path, "rb") as fh:
                  return fh.read().replace(b"\r\n", b"\n")
          if read(out) != read("tests/golden/map.default.out.json"):
              sys.exit("Packaged formatter output differs from tests/golden/map.default.out.json")
          print("Packaged formatter output matches the golden file")

      - name: Upload WinMerge plugin
        uses: actions/upload-artifact@v7
        with:
          name: RPGJsonBeautifier-WinMerge-x64
          path: dist/MergePlugins/
          if-no-files-found: error
