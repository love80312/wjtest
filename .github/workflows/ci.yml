name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Python formatter tests
        run: python -m unittest discover -s tests -v

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsPath = & $vswhere -latest -products * -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio installation was not found."
          }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          if (-not (Test-Path $installer)) {
            throw "Visual Studio Installer setup.exe was not found."
          }

          & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --wait --norestart

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the Visual C++ ATL component. Exit code: $LASTEXITCODE"
          }

      - name: Verify ATL header
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath

          $atlHeader = Get-ChildItem `
            -Path "$vsPath\VC\Tools\MSVC" `
            -Filter atlbase.h `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $atlHeader) {
            throw "atlbase.h was not found after ATL installation."
          }

          Write-Host "ATL header found: $($atlHeader.FullName)"

      - name: Build x64 COM DLL
        shell: pwsh
        run: |
          msbuild src/RPGJsonBeautifier.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload native build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RPGJsonBeautifier-native-draft
          path: |
            src/Build/x64/Release/MergePlugins/**/*.dll
            src/Build/x64/Release/MergePlugins/**/*.tlb
          if-no-files-found: error
