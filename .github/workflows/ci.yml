name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Python formatter tests
        run: python -m unittest discover -s tests -v

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 COM DLL draft
        shell: pwsh
        run: msbuild src/RPGJsonBeautifier.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload native build output for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RPGJsonBeautifier-native-draft
          path: |
            src/x64/Release/**/*.dll
            src/x64/Release/**/*.tlb
          if-no-files-found: error
