
      - name: Install ATL for v143
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          if (-not (Test-Path $installer)) {
            throw "Visual Studio Installer setup.exe was not found."
          }

          $arguments = @(
            "modify"
            "--installPath"
            "`"$env:VS_PATH`""
            "--add"
            "Microsoft.VisualStudio.Component.VC.ATL"
            "--quiet"
            "--norestart"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "ATL installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "ATL installation failed with exit code $($process.ExitCode)"
          }
