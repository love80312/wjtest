; RPGJsonBeautifier layout settings.
; Keep this file next to RPGJsonBeautifier.py (WinMerge's MergePlugins folder).
; Values: true / false (also yes/no, on/off, 1/0). A missing key uses the default shown here.
; The defaults match the standalone "RPG JSON 美化工具" (RPGgameJSON_9.html), so both tools
; produce the same text. Only whitespace is ever changed, whatever you choose here.

[format]
; "tight": no space after "," and ":"  ->  "data":[0,0,0,0,0]
; false: "data": [0, 0, 0, 0, 0]
tight = true

; Merge closing brackets that directly follow another closing bracket:  }]}  instead of }\n]\n}
hug = true

; Indent with Tab (true) or two spaces (false).
tab = true

; "{" joins its first entry, "[" joins a leading null, and a lone [[1,0,0]] or a short [true,false] stays on one line.
snug = true

; Consecutive empty-valued entries ("a":"", "b":[], "c":null, "d":{}) and adjacent "" inside an array share one line.
merge_empty = true

; Wrap very long all-number arrays (e.g. map tile data) at about 100 columns.
; false keeps every numeric array on a single line, which is easier to diff line by line.
wrap = false
